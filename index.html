<html lang="pt-BR">

    <meta charset="UTF-8" />

      name="description"
      content="Equipe do Observatório Agro Catarinense, sob a gestão técnica da Epagri/Cepa."
    />
    <title>Equipe | Observatório Agro Catarinense</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"

    />
    <style>
:root {
  --green: #2d5f2e;
  --green-dark: #2c3e35;
  --text: #333333;
  --muted: #707070;
  --section: #777777;
  --page-max: 1180px;
  --card-gap: clamp(1.25rem, 2.4vw, 2.4rem);
}

* {
  box-sizing: border-box;
}

html {
  background: #ffffff;
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: #ffffff;
  color: var(--text);
  font-family: "Roboto", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

.page-shell {
  width: min(calc(100% - 3rem), var(--page-max));
  margin: 0 auto;
  padding: clamp(2.75rem, 6vw, 5.5rem) 0 clamp(4rem, 8vw, 7rem);
}

.page-header {
  max-width: 860px;
  margin-bottom: clamp(2.5rem, 5vw, 4.5rem);
}

.eyebrow {
  margin: 0 0 0.35rem;
  color: var(--green);
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

h1 {
  margin: 0;
  color: var(--green);
  font-size: clamp(2rem, 3.2vw, 2.25rem);
  font-weight: 700;
  line-height: 1.12;
}

.intro {
  max-width: 820px;
  margin: 1.1rem 0 0;
  color: #333333;
  font-size: clamp(0.95rem, 1.35vw, 1rem);
  font-weight: 400;
  line-height: 1.65;
}

.team-section + .team-section {
  margin-top: clamp(3.75rem, 7vw, 6rem);
}

.section-heading {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin: 0 0 clamp(1.65rem, 3vw, 2.6rem);
  color: var(--section);
  font-size: clamp(1.1rem, 1.8vw, 1.25rem);
  font-weight: 700;
  line-height: 1.25;
}

.section-heading::after {
  display: block;
  width: min(230px, 20vw);
  height: 1px;
  background: #e4e9e4;
  content: "";
}

.team-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  column-gap: var(--card-gap);
  row-gap: clamp(2.5rem, 4.4vw, 4.5rem);
  align-items: start;
}

.person-card {
  min-width: 0;
  text-align: center;
}

.photo-frame {
  display: grid;
  place-items: center;
  min-height: 132px;
  margin-bottom: 0.9rem;
  overflow: visible;
}

.person-photo {
  display: block;
  width: clamp(94px, 8vw, 124px);
  aspect-ratio: 1;
  border-radius: 50%;
  object-fit: cover;
  background: #edf1ed;
  transition: transform 280ms cubic-bezier(0.22, 0.61, 0.36, 1);
  will-change: transform;
}

.person-photo:hover,
.person-photo:focus-visible {
  transform: translateY(-6px) scale(1.15);
  outline: none;
}

.person-name {
  margin: 0 auto;
  color: var(--green-dark);
  font-size: clamp(0.95rem, 1.35vw, 1.08rem);
  font-weight: 700;
  line-height: 1.3;
}

.person-role,
.person-detail {
  margin: 0.38rem auto 0;
  max-width: 210px;
  color: #666666;
  font-size: clamp(0.8rem, 1.05vw, 0.875rem);
  font-weight: 400;
  line-height: 1.45;
}

.person-detail {
  margin-top: 0.16rem;
  color: #777777;
}

@media (max-width: 980px) {
  .team-grid {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}

@media (max-width: 720px) {
  .page-shell {
    width: min(calc(100% - 2rem), 560px);
    padding-top: 2.5rem;
  }

  .team-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    column-gap: 1rem;
    row-gap: 2.75rem;
  }

  .section-heading {
    align-items: flex-start;
    flex-direction: column;
    gap: 0.65rem;
  }

  .section-heading::after {
    width: 64px;
  }

  .photo-frame {
    min-height: 112px;
  }

  .person-photo {
    width: 104px;
  }
}

@media (max-width: 390px) {
  .page-shell {
    width: min(calc(100% - 1.5rem), 340px);
  }

  .person-photo {
    width: 92px;
  }

  .person-name {
    font-size: 0.9rem;
  }

  .person-role,
  .person-detail {
    font-size: 0.76rem;
  }
}

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }

  .person-photo {
    transition: none;
  }
}

    </style>
  </head>
  <body>

      </header>

      <div id="team-sections" aria-live="polite"></div>

  { title: "Equipe permanente Epagri/Cepa", people: permanent },
  { title: "Rede permanente - descentralizada", people: decentralized },
  { title: "Equipe de apoio", people: support },
];

function fallbackImage(event, name) {
  const image = event.currentTarget;
  image.removeAttribute("src");
  image.alt = `Foto de ${name}`;
  image.style.background = "linear-gradient(135deg, #dfe9df, #8aaa8b)";
}

function createPersonCard([name, role, detail, imageUrl]) {
  const article = document.createElement("article");
  article.className = "person-card";
  article.innerHTML = `
    <div class="photo-frame">
      <img class="person-photo" src="${imageUrl}" alt="Foto de ${name}" tabindex="0" />
    </div>
    <h3 class="person-name">${name}</h3>
    <p class="person-role">${role}</p>
    ${detail ? `<p class="person-detail">${detail}</p>` : ""}
  `;
  article.querySelector("img").addEventListener("error", (event) => fallbackImage(event, name));
  return article;
}

const root = document.querySelector("#team-sections");

sections.forEach(({ title, people }) => {
  const section = document.createElement("section");
  section.className = "team-section";
  section.innerHTML = `<h2 class="section-heading">${title}</h2><div class="team-grid"></div>`;
  const grid = section.querySelector(".team-grid");
  people.forEach((person) => grid.appendChild(createPersonCard(person)));
  root.appendChild(section);
});
